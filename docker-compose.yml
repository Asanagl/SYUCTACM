services:
  postgres:
    image: postgres:16-alpine
    container_name: syuctacm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syuctacm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syuctacm_secret}
      POSTGRES_DB: ${POSTGRES_DB:-syuctacm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syuctacm} -d ${POSTGRES_DB:-syuctacm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: syuctacm-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-syuctacm}:${POSTGRES_PASSWORD:-syuctacm_secret}@postgres:5432/${POSTGRES_DB:-syuctacm}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-syuctacm_super_secret_jwt_key_change_in_production}
      CORS_ALLOW_ORIGINS: "*"
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: syuctacm-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${PORT:-3000}:80"

volumes:
  pgdata:
