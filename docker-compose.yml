services:
  postgres:
    image: postgres:16-alpine
    container_name: syuctacm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syuctacm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syuctacm_secret}
      POSTGRES_DB: ${POSTGRES_DB:-syuctacm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syuctacm} -d ${POSTGRES_DB:-syuctacm}"]
      interval: 5s
      timeout: 5s
      retries: 5
